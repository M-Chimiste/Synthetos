server {
    listen 80;
    server_name _;

    # Compress responses for the SPA assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: proxy to the api service. SSE-friendly settings.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: don't buffer, let the client read each chunk.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Health passthrough (api router mounts it at root).
    location = /health {
        proxy_pass http://api:8000/health;
    }

    # Static SPA. try_files makes client-side routing work on refresh.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
