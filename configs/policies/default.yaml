allowed_command_scopes:
  create_cycle:
    - cycles.write
  pause_cycle:
    - runs.control
  cancel_cycle:
    - runs.control
  resume_cycle:
    - runs.control
approval_rules:
  network_enabled_run: human_only
  sensitive_orchestrator_action: human_only
literature:
  fulltext_budget:
    max_fetches: 3
execution:
  auto_run_profiles:
    - cpu-small
    - gpu-small
  deny_without_force_start:
    network_mode:
      - enabled
    image_keys:
      - custom
