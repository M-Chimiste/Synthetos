allowed_command_scopes:
  create_cycle:
    - cycles.write
  pause_cycle:
    - runs.control
  cancel_cycle:
    - runs.control
  resume_cycle:
    - runs.control
approval_rules:
  network_enabled_run: human_only
  sensitive_orchestrator_action: human_only
literature:
  fulltext_budget:
    max_fetches: 3
execution:
  auto_run_profiles:
    - cpu-small
    - gpu-small
  deny_without_force_start:
    network_mode:
      - enabled
    image_keys:
      - custom
  max_retry_attempts: 3
  max_concurrent_runs: 2
  lease_timeout_minutes: 5
verification:
  require_baseline_comparison: true
  require_historical_comparison: true
  auto_postmortem_on_failure: true
  leakage_check_enabled: true
  split_validation_enabled: true
  min_outcome_for_promotion: tentative
  self_critic_enabled: true
  default_significance_threshold: 0.01
  default_stall_window: 3
remediation:
  enabled: true
  max_attempts_per_run: 3
  focused_failure_classes:
    - dependency_failure
    - runtime_exception
    - metric_parse_failure
    - invalid_artifact_output
  full_debug_failure_classes:
    - timeout
    - oom_or_resource_limit
  escalate_to_full_debug_after: 1
  max_stderr_chars: 3000
  max_code_chars: 8000
skills:
  validation_mode: strict
