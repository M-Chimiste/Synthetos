# Model routing configuration
# Maps logical roles to provider/model pairs.
# The model gateway router uses this to dispatch LLM calls.

defaults:
  temperature: 0.7
  max_tokens: 4096
  # Serving context window for budget trimming. Sonnet-class default here;
  # local-model configs MUST override with the actual serving window.
  context_window: 200000
  # Per-LLM-call timeout. Hosted models respond in seconds-to-minutes.
  timeout_s: 600
  # Reliability-layer budgets (deep-merged with per-role `retry` overrides).
  retry:
    transport_attempts: 3
    timeout_attempts: 2
    validation_attempts: 2
    truncation_attempts: 1
    backoff_base_s: 2.0
    backoff_max_s: 60.0
    max_tokens_growth: 2.0
    max_tokens_ceiling: 16384

roles:
  planning:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.5

  retrieval_synthesis:
    provider: anthropic
    model: claude-sonnet-4-20250514

  metadata_analysis:
    provider: local
    model: default
    base_url: http://localhost:11434/v1
    temperature: 0.3

  coding:
    provider: local
    model: default
    base_url: http://localhost:11434/v1
    temperature: 0.2

  summarization:
    provider: local
    model: default
    base_url: http://localhost:11434/v1
    temperature: 0.3

  evaluation:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.2

  report_writing:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.5

  graph_extraction:
    provider: local
    model: default
    base_url: http://localhost:11434/v1
    temperature: 0.1

  hypothesis_generation:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.7

  protocol_drafting:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.3

# Embeddings router profiles -- used by EmbeddingsRouter
# The corpus is pre-embedded with Alibaba-NLP/gte-modernbert-base, so any
# query-time profile MUST serve the same checkpoint or cosine results will
# be garbage. The dimension is locked to 768.
embeddings:
  default:
    provider: local
    model: Alibaba-NLP/gte-modernbert-base
    base_url: http://localhost:8080/v1   # text-embeddings-inference / vllm
    dimension: 768

# Provider configurations
providers:
  anthropic:
    # Uses ANTHROPIC_API_KEY env var
    type: anthropic
    max_concurrent_requests: 4

  openai:
    # Uses OPENAI_API_KEY env var
    type: openai
    max_concurrent_requests: 4

  google:
    # Uses GOOGLE_API_KEY env var
    type: google
    max_concurrent_requests: 4

  local:
    type: openai_compatible
    base_url: http://localhost:11434/v1
    # Cap in-flight requests to the single local server (per process):
    # piling up concurrent 15-minute generations only compounds latency.
    max_concurrent_requests: 2
