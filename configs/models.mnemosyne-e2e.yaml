# Local Mnemosyne routing for workstation E2E runs.
#
# Qwen3 GGUF returns reasoning wrappers by default; disable thinking at the
# request layer and strip any remaining <think> tags before downstream JSON
# parsing.

defaults:
  temperature: 0.2
  max_tokens: 4096
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
    reasoning_format: none
  strip_reasoning_tags: true

roles:
  planning: &qwen_local
    provider: mnemosyne
    model: qwen3-6-35b-a3b-mtp-gguf
    temperature: 0.2

  retrieval_synthesis: *qwen_local
  metadata_analysis: *qwen_local
  coding: *qwen_local
  summarization: *qwen_local
  evaluation: *qwen_local
  report_writing: *qwen_local
  paper_analysis: *qwen_local
  graph_extraction:
    provider: mnemosyne
    model: lfm2-5-8b-a1b
    temperature: 0.1
    max_tokens: 1024
    extra_body: {}
    strip_reasoning_tags: false
  paper_review: *qwen_local
  hypothesis_generation: *qwen_local
  protocol_drafting: *qwen_local
  remediation: *qwen_local
  context_compression: *qwen_local

embeddings:
  default:
    provider: local_embeddings
    model: Alibaba-NLP/gte-modernbert-base
    dimension: 768

providers:
  mnemosyne:
    type: openai_compatible
    base_url: http://localhost:8000/v1

  local_embeddings:
    type: sentence_transformers
