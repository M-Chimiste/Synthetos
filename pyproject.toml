[project]
name = "synthetos"
version = "0.1.0"
description = "ML Laboratory Co-Scientist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "typer>=0.15,<1",
    "structlog>=24.4,<26",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "jinja2>=3.1,<4",
    "orjson>=3.10,<4",
    "uuid-utils>=0.10,<1",
    "anthropic>=0.52,<1",
    "openai>=1.68,<2",
    "google-genai>=1.12,<2",
    "pyyaml>=6.0,<7",
    "python-frontmatter>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "pyright>=1.1,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-httpx>=0.35,<1",
    "testcontainers[postgres]>=4,<5",
    "factory-boy>=3.3,<4",
]

[project.scripts]
synthetos = "apps.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "libs"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"apps/api/**" = ["B008"]  # Depends() / Query() in function defaults is idiomatic FastAPI

[tool.ruff.lint.isort]
known-first-party = ["apps", "libs"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "libs"]
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
